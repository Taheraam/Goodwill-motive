# Local stack: MongoDB (single-node replica set) + the API.
#   docker compose -f infrastructure/docker-compose.yml up --build
#
# Prisma's MongoDB connector needs a replica set for transactions (the contribution
# engine uses $transaction), so a plain `mongod` is not enough.
# From your host machine, connect with:
#   mongodb://localhost:27017/goodwillmotive?directConnection=true
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once it is PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mongodb://mongo:27017/goodwillmotive?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
      FRONTEND_URL: http://localhost:3000
      ALLOW_OAUTH_SANDBOX: "true"
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
