services:
  - type: web
    name: goodwill-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm --workspace=@goodwill/shared run build && npm --workspace=backend run build
    startCommand: npm --workspace=backend run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
